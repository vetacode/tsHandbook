<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <title>TypeScript Dom Manipulation</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Assume index.js is the compiled output of index.ts -->
    <script src="index.js"></script>
  </body>
</html>

<!-- 
// 1. Apa itu DOM?
Website itu awalnya cuma HTML statis (tidak berubah).

Contoh:
<div id="app"></div>

Secara default, itu cuma kotak kosong.
DOM (Document Object Model) adalah cara browser merepresentasikan HTML sebagai objek JavaScript supaya bisa kita ubah-ubah lewat kode.

Jadi:
HTML ➜ diubah jadi objek ➜ bisa dimanipulasi pakai JavaScript / TypeScript

// 2. Kenapa ada HTMLElement?
TypeScript punya tipe bawaan untuk DOM.
Salah satu yang paling penting adalah:

HTMLElement

Artinya:
Semua elemen HTML seperti <div>, <p>, <button>, dll itu turunan dari HTMLElement.

Jadi kalau kita ambil elemen dari DOM, TypeScript tahu itu adalah objek HTML yang punya properti seperti:
.textContent
.appendChild()
.style
dll

// 3. Penjelasan Contoh Kode
Kita punya HTML:

<div id="app"></div>

Sekarang kita mau tambahkan:
<p>Hello, World!</p>

menggunakan TypeScript, STEP:
✅ Step 1 – Ambil elemen dari HTML
const app = document.getElementById("app");

Artinya:
Ambil elemen yang punya id "app"

TypeScript tahu ini bisa jadi HTMLElement | null
Karena mungkin saja elemen itu tidak ada.

✅ Step 2 – Buat elemen baru
const p = document.createElement("p");

Artinya:
Buat elemen <p> baru di memori (belum muncul di halaman)

✅ Step 3 – Isi teksnya
p.textContent = "Hello, World!";

Artinya:
Masukkan tulisan ke dalam <p>

✅ Step 4 – Masukkan ke dalam div
app?.appendChild(p);

Artinya:
Tambahkan <p> ke dalam <div id="app">

Tanda ?. disebut optional chaining

Artinya:
Kalau app tidak null, baru jalankan appendChild

//4. Hasil akhirnya

HTML berubah dari:
<div id="app"></div>

Menjadi:
<div id="app">
  <p>Hello, World!</p>
</div>

Padahal kita tidak mengubah HTML manual.
Semua dilakukan lewat JavaScript/TypeScript.

🎯 Kesimpulan Sederhana
HTML awalnya statis
DOM membuat HTML bisa diubah lewat JavaScript
TypeScript menyediakan tipe seperti HTMLElement
Kita bisa:
  - ambil elemen
  - buat elemen baru
  - isi konten
  - tempel ke halaman

Itulah yang disebut DOM Manipulation.
-->
